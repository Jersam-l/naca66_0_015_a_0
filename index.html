<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repository Artifact Exporter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #040508;
      --card: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 24px 16px 96px;
    }
    .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    .container { max-width: 1280px; margin: 0 auto; }
    .glass {
      background: var(--card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 20px;
    }
    .header { padding: 20px 24px; margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.45);
      color: var(--accent);
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .item-card { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .item-card img { width: 100%; height: 180px; object-fit: contain; background: #06070a; border-radius: 12px; border: 1px solid var(--border); }
    .tree-box { padding: 20px; overflow-x: auto; font-size: 13px; line-height: 1.7; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <!--
    WEB FILE #2 — ZERO-SCRIPT REPOSITORY EXPORTER
    Drop this single index.html into the root of any project repository (e.g., repo_1/index.html)
    and deploy it to GitHub Pages, Vercel, or Firebase Hosting.
    It automatically discovers the repository tree via GitHub API (or ./manifest.json if present)
    and exposes the segregated artifacts (Tree, Images, PDFs, CSVs, Docs) to your Unified Web viewer.
  -->
  <div class="container">
    <header class="glass header">
      <div>
        <div class="mono" style="font-size: 12px; color: var(--accent);" id="repo-slug">Auto-Discovering Repository...</div>
        <h1 style="font-size: 20px; font-weight: 700; margin-top: 4px;">Repository Artifact Exporter Node</h1>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="tree">Tree</button>
        <button class="tab-btn" data-tab="image">Images</button>
        <button class="tab-btn" data-tab="pdf">PDFs</button>
        <button class="tab-btn" data-tab="csv">CSVs</button>
        <button class="tab-btn" data-tab="doc">Docs</button>
      </div>
    </header>
    <main id="stage"></main>
  </div>

  <script>
    const EXT_MAP = {
      png: 'image', jpg: 'image', jpeg: 'image', svg: 'image', webp: 'image', gif: 'image',
      pdf: 'pdf',
      csv: 'csv', tsv: 'csv', dat: 'csv',
      md: 'doc', txt: 'doc', json: 'doc', jsonl: 'doc', log: 'doc'
    };

    let allFiles = [];
    let currentTab = 'tree';

    function categorize(path) {
      const ext = (path.split('.').pop() || '').toLowerCase();
      return EXT_MAP[ext] || null;
    }

    function detectGitHubRepo() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('repo')) {
        const [owner, repo] = params.get('repo').split('/');
        return { owner, repo, branch: params.get('branch') || 'main' };
      }
      const host = window.location.hostname;
      const parts = window.location.pathname.split('/').filter(Boolean);
      if (host.endsWith('.github.io')) {
        const owner = host.replace('.github.io', '');
        const repo = parts[0] || `${owner}.github.io`;
        return { owner, repo, branch: 'main' };
      }
      return null;
    }

    async function discoverArtifacts() {
      // 1. Try ./manifest.json first if present
      try {
        const res = await fetch('./manifest.json', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data.artifacts)) {
            document.getElementById('repo-slug').textContent = data.repoName || window.location.hostname;
            allFiles = data.artifacts;
            render();
            return;
          }
        }
      } catch (_) {}

      // 2. Auto-discover via GitHub Trees API (zero scripts required!)
      const gh = detectGitHubRepo();
      if (gh && gh.owner && gh.repo) {
        document.getElementById('repo-slug').textContent = `${gh.owner}/${gh.repo}`;
        for (const branch of [gh.branch, 'main', 'master', 'gh-pages']) {
          try {
            const apiUrl = `https://api.github.com/repos/${gh.owner}/${gh.repo}/git/trees/${branch}?recursive=1`;
            const res = await fetch(apiUrl);
            if (!res.ok) continue;
            const data = await res.json();
            if (Array.isArray(data.tree)) {
              allFiles = data.tree
                .filter(item => item.type === 'blob' && item.path !== 'index.html' && !item.path.startsWith('.'))
                .map(item => {
                  const cat = categorize(item.path);
                  if (!cat) return null;
                  const name = item.path.split('/').pop();
                  const dirParts = item.path.split('/');
                  dirParts.pop();
                  return {
                    path: item.path,
                    name,
                    directory: dirParts.join('/') || '(root)',
                    category: cat,
                    size: item.size || 0,
                    url: `https://raw.githubusercontent.com/${gh.owner}/${gh.repo}/${branch}/${item.path}`
                  };
                })
                .filter(Boolean);
              render();
              return;
            }
          } catch (_) {}
        }
      }

      document.getElementById('repo-slug').textContent = window.location.href;
      render();
    }

    function render() {
      const stage = document.getElementById('stage');
      if (allFiles.length === 0) {
        stage.innerHTML = `<div class="glass tree-box mono">Exporter active at ${window.location.href}. Copy this deployed URL into your Unified Web src/data/projects-registry.json or src/data/endpoints.txt.</div>`;
        return;
      }

      if (currentTab === 'tree') {
        const lines = allFiles.map((f, i) => {
          const prefix = i === allFiles.length - 1 ? '└── ' : '├── ';
          return `${prefix}<a href="${f.url}" target="_blank" rel="noopener">${f.path}</a> <span style="color:var(--muted)">(${f.category})</span>`;
        }).join('\n');
        stage.innerHTML = `<pre class="glass tree-box mono">.\n${lines}</pre>`;
        return;
      }

      const filtered = allFiles.filter(f => f.category === currentTab);
      stage.innerHTML = `<div class="grid">${filtered.map(f => `
        <div class="glass item-card">
          ${f.category === 'image' ? `<img src="${f.url}" alt="${f.name}" loading="lazy" />` : ''}
          <div class="mono" style="font-size:12px;font-weight:600;word-break:break-all;">${f.name}</div>
          <div class="mono" style="font-size:11px;color:var(--muted);">${f.directory}</div>
          <a class="mono" style="font-size:11px;" href="${f.url}" target="_blank" rel="noopener">Open Artifact →</a>
        </div>
      `).join('')}</div>`;
    }

    document.getElementById('tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      render();
    });

    discoverArtifacts();
  </script>
</body>
</html>
